app:
  name: AtlasBridge AI Proxy
  mode: manual
  first_run_completed: false

server:
  host: 127.0.0.1
  port: 20127
  admin_path: /admin

downstream:
  base_url: http://127.0.0.1:20128/v1
  timeout_seconds: 120

security:
  admin_auth_enabled: true
  bind_localhost_only: true
  allow_lan_access: false

startup:
  run_at_login: false
  start_proxy_on_app_launch: true
  restart_after_crash: true

routing:
  auto_routing: true
  default_route: route.default
  low_confidence_route: route.default
  confidence_threshold: 0.55
  smart_fast_route: route.low_cost
  metadata_transport: model_alias

logging:
  level: info
  privacy_mode: standard
  prompt_logging_enabled: false
  metadata_logging_enabled: true
  retention_days: 7
