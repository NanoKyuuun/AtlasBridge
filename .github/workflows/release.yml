name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Go binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ldflags = "-X github.com/smart-ai-proxy/smart-ai-proxy/internal/server.Version=$VERSION"
          go build -ldflags $ldflags -o smart-ai-proxy.exe ./cmd/smart-ai-proxy

      - name: Create release archive
        run: |
          $version = $env:GITHUB_REF_NAME -replace 'v',''
          $zipName = "smart-ai-proxy-$version-windows-x64-portable.zip"
          Compress-Archive -Path smart-ai-proxy.exe,README.md,QUICKSTART.md -DestinationPath $zipName

      - name: Generate checksums
        run: |
          $sha256 = (Get-FileHash smart-ai-proxy.exe -Algorithm SHA256).Hash.ToLower()
          "sha256  $sha256  smart-ai-proxy.exe" | Out-File -FilePath checksums.txt -Encoding UTF8

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.exe
            checksums.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}