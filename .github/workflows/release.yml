name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Go binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $ldflags = "-X github.com/atlasbridge/atlasbridge/internal/server.Version=$VERSION"
          go build -ldflags $ldflags -o atlasbridge.exe ./cmd/atlasbridge

      - name: Create release archive
        run: |
          $version = $env:GITHUB_REF_NAME -replace 'v',''
          $zipName = "atlasbridge-$version-windows-x64-portable.zip"
          Compress-Archive -Path atlasbridge.exe,README.md,QUICKSTART.md -DestinationPath $zipName

      - name: Generate checksums
        run: |
          $sha256 = (Get-FileHash atlasbridge.exe -Algorithm SHA256).Hash.ToLower()
          "sha256  $sha256  atlasbridge.exe" | Out-File -FilePath checksums.txt -Encoding UTF8

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            *.zip
            *.exe
            checksums.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}